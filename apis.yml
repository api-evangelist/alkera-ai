aid: alkera-ai
name: Alkera Ai
description: >-
  Alkera is an AI data-engineering agent that works across your data stack from the command
  line and inside your editor to build, migrate, optimize, and debug data pipelines. It ships
  as a CLI and an IDE extension (VS Code and Open VSX forks such as Cursor and Windsurf), and
  pairs a cross-platform column-level lineage engine with a living knowledge base so the agent
  understands what your data means and what your team already decided about it. Alkera connects
  natively to 14+ platforms including Snowflake, Databricks, BigQuery, dbt, and Airflow, builds
  new pipelines end to end (sources, models, tests, orchestration), migrates legacy systems
  while verifying functional equivalence, removes dead pipelines, refactors slow models, and
  performs root-cause analysis with blast-radius awareness. It ranked first on DataAgentBench
  (83.28% Pass@1). Enterprise deployments add SSO/SAML, SCIM & IAM, audit logs, pooled usage,
  VPC and on-prem deployment, zero data retention by default, data residency controls, and SLAs.
